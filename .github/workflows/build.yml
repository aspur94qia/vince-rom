name: Build Vince OpenWrt Source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git autopoint \
          libelf-dev libdw-dev libncurses-dev libssl-dev python3 python3-setuptools \
          python3-dev python3-pyelftools rsync subversion swig time u-boot-tools \
          device-tree-compiler unzip wget curl zstd flex bison ca-certificates xsltproc zlib1g-dev libffi-dev

      - name: Clone OpenWrt Target MSM89xx
        run: |
          git clone --depth 1 -b master https://github.com/lkiuyu/immortalwrt openwrt

      - name: Fix Elfutils Obstack Build Failure
        run: |
          cd openwrt
          if [ -f tools/elfutils/Makefile ]; then
            sed -i 's/PKG_BUILD_PARALLEL:=1/PKG_BUILD_PARALLEL:=0/g' tools/elfutils/Makefile || true
          fi

      - name: Update Feeds & Install Packages
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Custom App Packages & Files
        run: |
          cd openwrt
          git clone --depth 1 https://github.com/4IceG/luci-app-sms-tool-js.git package/luci-app-sms-tool-js || true
          git clone --depth 1 https://github.com/4IceG/luci-app-modemband.git package/luci-app-modemband || true
          cp -r ../files .

      - name: Generate Config & Download Sources
        run: |
          cd openwrt
          cat << 'CFG' > .config
          CONFIG_TARGET_msm89xx=y
          CONFIG_TARGET_msm89xx_generic=y
          CONFIG_TARGET_DEVICE_msm89xx_generic_DEVICE_xiaomi_vince=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_hostapd=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-travelmate=y
          CONFIG_PACKAGE_relayd=y
          CONFIG_PACKAGE_modemmanager=y
          CONFIG_PACKAGE_luci-proto-modemmanager=y
          CONFIG_PACKAGE_qmi-utils=y
          CONFIG_PACKAGE_mbim-utils=y
          CONFIG_PACKAGE_sms-tool=y
          CONFIG_PACKAGE_luci-app-modemband=y
          CONFIG_PACKAGE_luci-app-sms-tool-js=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-serial-qualcomm=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CFG
          make defconfig
          make download -j8 V=s || make download -j1 V=s

      - name: Compile Firmware Image
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Collect & Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-vince-firmware
          path: openwrt/bin/targets/msm89xx/generic/*
